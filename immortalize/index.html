<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Immortalize · nft.gift</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='84'>🎁</text></svg>">
<style>
  :root{--paper:#efe4cd;--card:#fff7e6;--line:#e0d2b2;--ink:#2b2118;--dim:#8a7a5f;--coral:#ff5a5f;--gold:#f0a316;--mint:#2bb673;--font:"Trebuchet MS","Segoe UI",system-ui,sans-serif}
  @media (prefers-color-scheme:dark){:root{--paper:#211b12;--card:#2b2418;--line:#4a3d28;--ink:#f6ecd8;--dim:#b6a483;--coral:#ff7a7e;--gold:#ffc24d;--mint:#4bd492}}
  :root[data-theme="light"]{--paper:#efe4cd;--card:#fff7e6;--line:#e0d2b2;--ink:#2b2118;--dim:#8a7a5f;--coral:#ff5a5f;--gold:#f0a316;--mint:#2bb673}
  :root[data-theme="dark"]{--paper:#211b12;--card:#2b2418;--line:#4a3d28;--ink:#f6ecd8;--dim:#b6a483;--coral:#ff7a7e;--gold:#ffc24d;--mint:#4bd492}
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--font);color:var(--ink);background:var(--paper);line-height:1.6;min-height:100vh;
    background-image:radial-gradient(color-mix(in srgb,var(--line) 70%,transparent) .9px,transparent .9px);background-size:22px 22px}
  header{display:flex;align-items:center;justify-content:space-between;padding:16px clamp(16px,5vw,44px)}
  .logo{font-weight:800;font-size:22px;text-decoration:none} .logo b{color:var(--coral)}
  header a.mk{text-decoration:none;color:#fff;font-weight:800;font-size:15px;padding:9px 16px;border-radius:12px;background:var(--coral);border:2px solid color-mix(in srgb,var(--coral) 60%,#000)}
  main{max-width:560px;margin:0 auto;padding:min(12vh,90px) clamp(16px,5vw,44px) 60px;text-align:center}
  .badge{display:inline-block;background:var(--gold);color:#3a2a06;font-weight:800;font-size:14px;padding:6px 14px;border-radius:99px;transform:rotate(-2deg);animation:tw 2.2s ease-in-out infinite}
  @keyframes tw{0%,100%{opacity:.8;transform:rotate(-2deg) scale(1)}50%{opacity:1;transform:rotate(-2deg) scale(1.05)}}
  h1{font-size:clamp(40px,9vw,60px);margin:18px 0 10px;letter-spacing:-.02em}
  p{font-size:19px;color:var(--ink);max-width:34ch;margin:0 auto 22px} b{color:var(--mint)}
  .cta{display:inline-flex;gap:9px;align-items:center;text-decoration:none;font-weight:800;font-size:18px;color:#fff;background:var(--coral);
    border:2.5px solid color-mix(in srgb,var(--coral) 60%,#000);border-radius:16px;padding:14px 26px;box-shadow:0 5px 0 color-mix(in srgb,var(--coral) 55%,#000)}
  .cta:hover{transform:translateY(-2px) rotate(-1.5deg)}
  .back{margin-top:22px;font-size:15px} .back a{color:var(--dim)}
  @media (prefers-reduced-motion:reduce){.badge{animation:none}}
</style>
</head>
<body>
  <header>
    <a class="logo" href="../">🎁 nft<b>.gift</b></a>
    <a class="mk" href="../make/">🖍️ Make a card</a>
  </header>
  <main>
    <div class="badge">✨ Coming soon</div>
    <h1>Immortalize</h1>
    <p>Soon you'll make your card <b>immortal</b> — written onto the blockchain, truly owned forever, and sent as a private gift-link. Just 29¢. A card that never ends up in a drawer.</p>
    <a class="cta" href="../make/">🖍️ Make a card</a>
    <p class="back"><a href="../">← back to nft.gift</a></p>
  </main>
</body>
</html>
