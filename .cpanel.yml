---
# cPanel Git™ Version Control deployment for nft.gift — the card maker.
#
# In cPanel → Git Version Control: clone this repo (branch main), then "Update from Remote" +
# "Deploy HEAD Commit". cPanel copies the self-contained card maker into nft.gift's web root.
#
# DEPLOYPATH = the nft.gift document root, relative to $HOME (set at deploy time, so the username
# never lands in the repo). An addon domain's Document Root usually shows as "/nft.gift" →
# $HOME/nft.gift. Confirm in cPanel → Domains and adjust the path below if it differs.
deployment:
  tasks:
    - export DEPLOYPATH="$HOME/nft.gift/"
    - /bin/cp index.html "$DEPLOYPATH"
